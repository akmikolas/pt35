# -*- conf -*-
# foot 终端配置 — PocketTerm35 (640x480)
#
# 段名依据包自带默认配置 /etc/xdg/foot/foot.ini（foot 1.28 权威）
# 注意：foot **没有** [text-input] 段（text-input 协议默认启用，编译期带 +ime）
#       颜色段是 [colors-dark] / [colors-light]，不是 [colors]

# ── 主段（无段名头，选项直接在文件开头）──────────────
# 字体：Terminus 等宽（清晰）+ 中文回退 Noto Sans Mono CJK
font=Terminus:size=16
font=Noto Sans Mono CJK SC:size=16

# 启动时按像素定窗口大小，正好铺满 640x480
initial-window-size-pixels=640x480
initial-window-mode=fullscreen

# 内边距（小屏留一点边更舒服）
pad=2x2

# 关闭字体等宽警告（CJK 字体常被误报）
# 该选项在 [tweak] 段，见下方

[scrollback]
lines=5000

[cursor]
style=block
blink=yes

[colors-dark]
# 深色主题（小屏高对比更易读）
background=1a1a1a
foreground=d0d0d0
regular0=1a1a1a
regular1=cc5555
regular2=55cc55
regular3=cccc55
regular4=5555cc
regular5=cc55cc
regular6=55cccc
regular7=d0d0d0
bright0=555555
bright1=ff6666
bright2=66ff66
bright3=ffff66
bright4=6666ff
bright5=ff66ff
bright6=66ffff
bright7=ffffff

[mouse]
hide-when-typing=yes

[tweak]
# CJK 字体不是严格等宽，foot 会警告；这里显式关掉
font-monospace-warn=no
