# -*- conf -*-
# foot 终端配置 — PocketTerm35 (640x480)
#
# ⚠️ 两个实测踩过的坑（见 docs/07-开机动画设计.md）：
#
# 1) `font=` 必须写成**一行逗号分隔**。写两个 `font=` 行，第二行会被忽略，
#    结果实际生效的是第一行。之前就是这么掉进 80x24 的坑。
# 2) `size=` 不能带 `px` 后缀 —— `size=11px` 会被 foot 拒绝并静默回退默认字体。
#    要么 `size=11`（磅），要么 `pixelsize=11`（像素）。
#
# 640x480 / DejaVu Sans Mono size=11 → **80 列 × 24 行**
# （别从字号推算，用 `tput cols; tput lines` 实测）

# ── 主段（无段名头，选项直接在文件开头）──────────────
# 字体：DejaVu Sans Mono（拉丁，字形全）+ Noto Sans Mono CJK（中文回退）
# ⚠️ 注意：块字符 █▓░▄▀ 会回退到 CJK 字体并渲染成**双宽**，
#    所以任何需要对齐的 TUI 都不要用它们（用纯 ASCII）。
font=DejaVu Sans Mono:size=11,Noto Sans Mono CJK SC:size=11

# 启动时按像素定窗口大小，正好铺满 640x480，并全屏
initial-window-size-pixels=640x480
initial-window-mode=fullscreen

# 内边距（小屏留一点边更舒服）
pad=2x2

# ── 背景（可用 pt35-bg 切换）──────────────────────────
# 预设: pt35-bg list     套用: pt35-bg void
# 自定义: pt35-bg bg 0a0f14    透明度: pt35-bg alpha 0.85
# 壁纸:   pt35-bg image /path/to.png
alpha=1.0
blur=no

[scrollback]
lines=5000

[cursor]
style=block
blink=yes

# ── 配色（Control 共振风格：冷灰白 + 单一高饱和红）────
[colors-dark]
background=1a1a1a
foreground=d0d0d0
regular0=1a1a1a
regular1=cc5555
regular2=55cc55
regular3=cccc55
regular4=5555cc
regular5=cc55cc
regular6=55cccc
regular7=d0d0d0
bright0=555555
bright1=ff6666
bright2=66ff66
bright3=ffff66
bright4=6666ff
bright5=ff66ff
bright6=66ffff
bright7=ffffff

[mouse]
hide-when-typing=yes

[tweak]
# CJK 字体不是严格等宽，foot 会警告；这里显式关掉
font-monospace-warn=no
